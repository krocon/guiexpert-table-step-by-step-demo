<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GuiExpert Table – step by step</title>
</head>
<body>
  <header class="app-header"><b>Orders</b> <button id="autosize">auto-size columns</button> <button id="by-status">sort status</button> <button id="newest">newest first</button>
    <input id="search" type="search" placeholder="search customer, city …" />
    <input id="min-total" type="range" min="0" max="20000" step="500" value="0" title="minimum total" /> <span id="info"></span> <span id="model"></span></header>
  <div class="table-div"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
